name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'vetra-plus-*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP Syntax Check
        run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('theme.json'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('assets/icons/vetra-icons.json'))"
      - name: Check theme structure
        run: test -f style.css && test -f functions.php && test -f screenshot.png
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD || true

  package:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/vetra-plus-')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Build WordPress theme ZIP
        run: |
          slug="vetra-portal-theme"
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/$slug"
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='*.zip' --exclude='tests' --exclude='docs' --exclude='tools' --exclude='vetra-plus' --exclude='.env*' ./ "$tmpdir/$slug/"
          (cd "$tmpdir" && zip -qr "$GITHUB_WORKSPACE/vetra.zip" "$slug/")
      - name: Build Vetra Plus ZIP
        run: |
          slug="vetra-plus"
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/$slug"
          rsync -a --exclude='.git' --exclude='*.zip' ./vetra-plus/ "$tmpdir/$slug/"
          (cd "$tmpdir" && zip -qr "$GITHUB_WORKSPACE/vetra-plus.zip" "$slug/")
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vetra.zip
            vetra-plus.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
